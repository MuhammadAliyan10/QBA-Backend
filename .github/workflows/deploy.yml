# =============================================================================
# QUANTA AUTOMATION PLATFORM - Production CI/CD Pipeline
# Azure Container Apps Deployment via GitHub Actions
# =============================================================================
#
# Triggers on push to main branch.
# Builds Docker images and deploys to Azure Container Apps.
#
# NOTE: This workflow runs from the `backend` repository root.
#
# Required GitHub Secrets:
#   - AZURE_CREDENTIALS: Service Principal JSON for Azure login
#   - PROD_DATABASE_URL: Supabase connection string
#   - PROD_NATS_URL: NATS server URL
#   - PROD_REDIS_URL: Redis connection URL
#   - PROD_TEMPORAL_HOST: Temporal server host
#   - CLERK_PUBLISHABLE_KEY: Clerk public key
#   - CLERK_SECRET_KEY: Clerk secret key
#   - POLAR_ACCESS_TOKEN: Polar API token
#   - POLAR_WEBHOOK_SECRET: Polar webhook signing secret
#   - OPENAI_API_KEY: OpenAI API key for LLM
#   - R2_ACCESS_KEY_ID: Cloudflare R2 access key
#   - R2_SECRET_ACCESS_KEY: Cloudflare R2 secret key
#   - R2_ENDPOINT_URL: Cloudflare R2 endpoint
#   - R2_BUCKET_NAME: Cloudflare R2 bucket name
#   - FERNET_KEY: Session encryption key
#
# =============================================================================

name: "🚀 Deploy to Azure"

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - "infra/**"
      - ".github/workflows/deploy.yml"

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

# =============================================================================
# PERMISSIONS
# =============================================================================

permissions:
  id-token: write # Required for OIDC authentication with Azure
  contents: read # Required to checkout code

# =============================================================================
# ENVIRONMENT VARIABLES
# =============================================================================

env:
  AZURE_RESOURCE_GROUP: "quanta-prod-rg"
  CONTAINER_APP_ENVIRONMENT: "quanta-prod-env"
  CONTROL_PLANE_APP_NAME: "control-plane"
  EXECUTION_PLANE_APP_NAME: "execution-plane"

# =============================================================================
# JOBS
# =============================================================================

jobs:
  # ===========================================================================
  # BUILD & DEPLOY
  # ===========================================================================
  deploy:
    name: "Build & Deploy to Azure"
    runs-on: ubuntu-latest
    environment: production

    steps:
      # -----------------------------------------------------------------------
      # 1. CHECKOUT CODE
      # -----------------------------------------------------------------------
      - name: "Checkout Repository"
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # 2. AZURE LOGIN
      # -----------------------------------------------------------------------
      - name: "Azure Login"
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # -----------------------------------------------------------------------
      # 3. GET ACR CREDENTIALS
      # -----------------------------------------------------------------------
      - name: "Get ACR Credentials"
        id: acr
        run: |
          # Get ACR name from resource group
          ACR_NAME=$(az acr list --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "[0].name" -o tsv)

          if [ -z "$ACR_NAME" ]; then
            echo "No ACR found in resource group ${{ env.AZURE_RESOURCE_GROUP }}"
            exit 1
          fi

          # Get ACR login server
          ACR_LOGIN_SERVER=$(az acr show --name $ACR_NAME --query "loginServer" -o tsv)

          # Get ACR credentials
          ACR_USERNAME=$(az acr credential show --name $ACR_NAME --query "username" -o tsv)
          ACR_PASSWORD=$(az acr credential show --name $ACR_NAME --query "passwords[0].value" -o tsv)

          # Set outputs (masked for security)
          echo "::add-mask::$ACR_PASSWORD"
          echo "acr_name=$ACR_NAME" >> $GITHUB_OUTPUT
          echo "acr_login_server=$ACR_LOGIN_SERVER" >> $GITHUB_OUTPUT
          echo "acr_username=$ACR_USERNAME" >> $GITHUB_OUTPUT
          echo "acr_password=$ACR_PASSWORD" >> $GITHUB_OUTPUT

          echo "CR: $ACR_LOGIN_SERVER"

      # -----------------------------------------------------------------------
      # 4. SET UP DOCKER BUILDX (Required for registry caching)
      # -----------------------------------------------------------------------
      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # 5. DOCKER LOGIN TO ACR
      # -----------------------------------------------------------------------
      - name: "Docker Login to ACR"
        uses: docker/login-action@v3
        with:
          registry: ${{ steps.acr.outputs.acr_login_server }}
          username: ${{ steps.acr.outputs.acr_username }}
          password: ${{ steps.acr.outputs.acr_password }}

      # -----------------------------------------------------------------------
      # 5. SET IMAGE TAGS
      # -----------------------------------------------------------------------
      - name: "Set Image Tags"
        id: tags
        run: |
          # Use commit SHA for immutable tags
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TIMESTAMP=$(date +%Y%m%d%H%M%S)

          echo "control_plane_tag=${{ steps.acr.outputs.acr_login_server }}/control-plane:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "execution_plane_tag=${{ steps.acr.outputs.acr_login_server }}/execution-plane:${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT

          echo "📦 Control Plane: control-plane:${SHORT_SHA}"
          echo "📦 Execution Plane: execution-plane:${SHORT_SHA}"

      # -----------------------------------------------------------------------
      # 6. BUILD & PUSH CONTROL PLANE (Go)
      # -----------------------------------------------------------------------
      - name: "Build & Push Control Plane (Go)"
        uses: docker/build-push-action@v5
        with:
          context: . # Root context needed for monorepo (api/ + apps/control-plane/)
          file: ./apps/control-plane/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.control_plane_tag }}
            ${{ steps.acr.outputs.acr_login_server }}/control-plane:latest
          # Note: cache-from removed for first build, add back after first successful build
          cache-to: type=registry,ref=${{ steps.acr.outputs.acr_login_server }}/control-plane:cache,mode=max

      # -----------------------------------------------------------------------
      # 7. BUILD & PUSH EXECUTION PLANE (Python)
      # -----------------------------------------------------------------------
      - name: "Build & Push Execution Plane (Python)"
        uses: docker/build-push-action@v5
        with:
          context: . # Build context is the backend root (needed for prisma schema)
          file: ./apps/execution-plane/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.execution_plane_tag }}
            ${{ steps.acr.outputs.acr_login_server }}/execution-plane:latest
          # Note: cache-from removed for first build, add back after first successful build
          cache-to: type=registry,ref=${{ steps.acr.outputs.acr_login_server }}/execution-plane:cache,mode=max

      # -----------------------------------------------------------------------
      # 8. DEPLOY CONTROL PLANE TO CONTAINER APPS
      # -----------------------------------------------------------------------
      - name: "Deploy Control Plane"
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          containerAppName: ${{ env.CONTROL_PLANE_APP_NAME }}
          imageToDeploy: ${{ steps.tags.outputs.control_plane_tag }}
          targetPort: 8080
          ingress: external
          registryUrl: ${{ steps.acr.outputs.acr_login_server }}
          registryUsername: ${{ steps.acr.outputs.acr_username }}
          registryPassword: ${{ steps.acr.outputs.acr_password }}
          environmentVariables: |
            DATABASE_URL=secretref:database-url
            NATS_URL=secretref:nats-url
            REDIS_URL=secretref:redis-url
            TEMPORAL_HOST=secretref:temporal-host
            CLERK_PUBLISHABLE_KEY=secretref:clerk-publishable-key
            CLERK_SECRET_KEY=secretref:clerk-secret-key
            POLAR_ACCESS_TOKEN=secretref:polar-access-token
            POLAR_WEBHOOK_SECRET=secretref:polar-webhook-secret
            GIN_MODE=release
            PORT_GO_API=8080

      # -----------------------------------------------------------------------
      # 9. SET CONTROL PLANE SECRETS
      # -----------------------------------------------------------------------
      - name: "Set Control Plane Secrets"
        run: |
          az containerapp secret set \
            --name ${{ env.CONTROL_PLANE_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --secrets \
              database-url="${{ secrets.PROD_DATABASE_URL }}" \
              nats-url="${{ secrets.PROD_NATS_URL }}" \
              redis-url="${{ secrets.PROD_REDIS_URL }}" \
              temporal-host="${{ secrets.PROD_TEMPORAL_HOST }}" \
              clerk-publishable-key="${{ secrets.CLERK_PUBLISHABLE_KEY }}" \
              clerk-secret-key="${{ secrets.CLERK_SECRET_KEY }}" \
              polar-access-token="${{ secrets.POLAR_ACCESS_TOKEN }}" \
              polar-webhook-secret="${{ secrets.POLAR_WEBHOOK_SECRET }}"

      # -----------------------------------------------------------------------
      # 10. DEPLOY EXECUTION PLANE TO CONTAINER APPS
      # -----------------------------------------------------------------------
      - name: "Deploy Execution Plane"
        uses: azure/container-apps-deploy-action@v1
        with:
          resourceGroup: ${{ env.AZURE_RESOURCE_GROUP }}
          containerAppEnvironment: ${{ env.CONTAINER_APP_ENVIRONMENT }}
          containerAppName: ${{ env.EXECUTION_PLANE_APP_NAME }}
          imageToDeploy: ${{ steps.tags.outputs.execution_plane_tag }}
          registryUrl: ${{ steps.acr.outputs.acr_login_server }}
          registryUsername: ${{ steps.acr.outputs.acr_username }}
          registryPassword: ${{ steps.acr.outputs.acr_password }}
          # No ingress - this is a worker, not a web service
          environmentVariables: |
            DATABASE_URL=secretref:database-url
            NATS_URL=secretref:nats-url
            TEMPORAL_HOST=secretref:temporal-host
            OPENAI_API_KEY=secretref:openai-api-key
            ENABLE_S3_UPLOAD=true
            S3_BUCKET=secretref:r2-bucket-name
            S3_ENDPOINT_URL=secretref:r2-endpoint-url
            AWS_ACCESS_KEY_ID=secretref:r2-access-key-id
            AWS_SECRET_ACCESS_KEY=secretref:r2-secret-access-key
            FERNET_KEY=secretref:fernet-key

      # -----------------------------------------------------------------------
      # 11. SET EXECUTION PLANE SECRETS
      # -----------------------------------------------------------------------
      - name: "Set Execution Plane Secrets"
        run: |
          az containerapp secret set \
            --name ${{ env.EXECUTION_PLANE_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --secrets \
              database-url="${{ secrets.PROD_DATABASE_URL }}" \
              nats-url="${{ secrets.PROD_NATS_URL }}" \
              temporal-host="${{ secrets.PROD_TEMPORAL_HOST }}" \
              openai-api-key="${{ secrets.OPENAI_API_KEY }}" \
              r2-bucket-name="${{ secrets.R2_BUCKET_NAME }}" \
              r2-endpoint-url="${{ secrets.R2_ENDPOINT_URL }}" \
              r2-access-key-id="${{ secrets.R2_ACCESS_KEY_ID }}" \
              r2-secret-access-key="${{ secrets.R2_SECRET_ACCESS_KEY }}" \
              fernet-key="${{ secrets.FERNET_KEY }}"

      # -----------------------------------------------------------------------
      # 12. VERIFY DEPLOYMENT
      # -----------------------------------------------------------------------
      - name: "Verify Deployment"
        run: |
          echo "🔍 Checking Control Plane status..."
          CONTROL_PLANE_URL=$(az containerapp show \
            --name ${{ env.CONTROL_PLANE_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "Control Plane URL: https://$CONTROL_PLANE_URL"

          # Wait for the app to be ready
          sleep 30

          # Health check
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://$CONTROL_PLANE_URL/health/live" || echo "000")

          if [ "$HTTP_STATUS" == "200" ]; then
            echo "Control Plane is healthy!"
          else
            echo "Control Plane health check returned: $HTTP_STATUS"
            echo "Please check logs: az containerapp logs show --name ${{ env.CONTROL_PLANE_APP_NAME }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }}"
          fi

      # -----------------------------------------------------------------------
      # 13. DEPLOYMENT SUMMARY
      # -----------------------------------------------------------------------
      - name: "Deployment Summary"
        run: |
          CONTROL_PLANE_URL=$(az containerapp show \
            --name ${{ env.CONTROL_PLANE_APP_NAME }} \
            --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)

          echo "=============================================="
          echo "DEPLOYMENT COMPLETE"
          echo "=============================================="
          echo ""
          echo "Images Deployed:"
          echo "   - control-plane:${{ steps.tags.outputs.short_sha }}"
          echo "   - execution-plane:${{ steps.tags.outputs.short_sha }}"
          echo ""
          echo "Endpoints:"
          echo "   - API: https://$CONTROL_PLANE_URL"
          echo "   - Health: https://$CONTROL_PLANE_URL/health"
          echo "   - WebSocket: wss://$CONTROL_PLANE_URL/ws"
          echo "   - Metrics: https://$CONTROL_PLANE_URL/metrics"
          echo ""
          echo "Commit: ${{ github.sha }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "=============================================="
