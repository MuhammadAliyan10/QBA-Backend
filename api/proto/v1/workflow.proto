syntax = "proto3";

package e2e.v1;

option go_package = "e2e-platform/api/gen/go/v1";

// --- SERVICE DEFINITION ---
service WorkflowService {
  // Trigger a new automation job (POST /run)
  rpc ExecuteWorkflow (ExecuteWorkflowRequest) returns (ExecuteWorkflowResponse);

  // Get live status (GET /status/:id)
  rpc GetJobStatus (GetJobStatusRequest) returns (GetJobStatusResponse);

  // Emergency Kill Switch (DELETE /job/:id)
  rpc TerminateJob (TerminateJobRequest) returns (TerminateJobResponse);

  // Human-in-the-Loop Resume (POST /resume)
  rpc ResumeJob (ResumeJobRequest) returns (ResumeJobResponse);
}

// --- MESSAGES ---

message ExecuteWorkflowRequest {
  string user_id = 1;
  string workflow_id = 2; // The specific recipe (e.g. "amazon_scraper")

  // Dynamic Inputs (e.g. {"url": "https://target.com", "search_term": "laptop"})
  map<string, string> params = 3;

  // [NEW] The "Glass Box" Configuration
  // This controls the "Physics" of the browser
  WorkflowConfig config = 4;
}

// [NEW] This struct controls the Browser Environment
message WorkflowConfig {
  bool use_premium_proxy = 1;  // If true, use Residential IP ($$$)
  bool solve_captchas = 2;     // If true, pause and ask dev for help
  string session_id = 3;       // Inject cookies from this saved session
  string region = 4;           // "us", "eu", "asia" (for Proxy)
}

message ExecuteWorkflowResponse {
  string job_id = 1;           // The UUID for this run
  string status = 2;           // "QUEUED", "RUNNING"
  int32 queue_position = 3;    // Load balancing info
}

message GetJobStatusRequest {
  string job_id = 1;
}

message GetJobStatusResponse {
  string job_id = 1;
  string status = 2;
  string current_step_id = 3;
  int32 percent_complete = 4;

  // [NEW] The output file (e.g., the PDF/CSV on R2)
  string result_url = 5;

  string error_message = 6;
}

message TerminateJobRequest {
  string job_id = 1;
  string reason = 2;
}

message TerminateJobResponse {
  bool success = 1;
}

message ResumeJobRequest {
  string job_id = 1;
  map<string, string> data = 2;  // e.g., {"decision": "yes", "otp": "123456"}
}

message ResumeJobResponse {
  bool success = 1;
  string message = 2;  // Error message if success = false
}
