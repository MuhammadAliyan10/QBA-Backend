syntax = "proto3";

package e2e.v1;

option go_package = "e2e-platform/api/gen/go/v1";

// Job Status Update Event
message JobEvent {
    string job_id = 1;
    string status = 2;  // "pending", "running", "completed", "failed"
    string message = 3;
    int64 timestamp = 4;
}

// Billing Event for Ledger Writes
message BillingEvent {
    string user_id = 1;
    int32 amount = 2;               // Positive for credit, negative for deduction
    int32 balance_after = 3;        // Balance after transaction
    string transaction_type = 4;    // "DEDUCTION", "TOPUP", "REFUND"
    string metadata = 5;            // JSON metadata (optional)
    int64 timestamp = 6;            // Unix timestamp
    string transaction_id = 7;      // Unique transaction ID
}

// Workflow Events
message WorkflowEvent {
    string workflow_id = 1;
    string user_id = 2;
    string status = 3;
    string error_message = 4;
    int64 started_at = 5;
    int64 completed_at = 6;
}
