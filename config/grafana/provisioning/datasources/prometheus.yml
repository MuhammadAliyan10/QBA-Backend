# config/grafana/provisioning/datasources/prometheus.yml
# Auto-provisions Prometheus as a Grafana datasource on first boot.
# Grafana reads this file from /etc/grafana/provisioning/datasources/

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: POST
