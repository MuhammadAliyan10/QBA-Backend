#! 1. JetStream (Durable Storage)

jetstream {
  # Directory to store JetStream data
  store_dir: "/data/jetstream"

  # Maximum memory for in-memory streams (1GB)
  max_mem: 1Gb

  # Maximum disk space for file-based streams (5GB)
  max_file: 5Gb
}

#? 2. Network Configuration

port: 4222        # Client Port (Go/Python connect here)
http_port: 8222   # Dashboard / Monitoring Port


#? 3. Limits & Timeouts

max_connections: 65536
ping_interval: 2m
max_payload: 8Mb   # Allow larger payloads (for HTML snapshots)


#? 4. Authentication (Disabled for localhost)

# Local development: no authentication
# In Production, use NKEYS or token-based auth
authorization {
  # Uncomment and configure for prod:
  # user: <username>
  # password: <password>
}

# -----------------------------
# Optional: Logging
# -----------------------------
# log_file: "/data/nats.log"
# debug: true
# trace: true
