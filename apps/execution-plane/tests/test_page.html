<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e2e Test Page</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .container { max-width: 600px; margin: 0 auto; }
        .hidden-gem { margin-top: 50px; border: 1px solid #ccc; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to e2e Testing</h1>
        
        <!-- Easy for Sniper -->
        <button id="login-btn">Login</button>
        
        <!-- Hard for Sniper, Needs Brain -->
        <div class="hidden-gem">
            <p>Looking for more info?</p>
            <a href="https://www.iana.org/domains/example">Click here to learn more about domains</a>
        </div>

        <!-- Input for TYPE action -->
        <input type="text" placeholder="Enter your username" id="username-input" style="margin-top: 20px; display: block;">
        
        <!-- Spacer for SCROLL action -->
        <div style="height: 1000px; background: linear-gradient(to bottom, #fff, #eee);"></div>
        
        <button id="footer-btn">Footer Action</button>
    </div>
</body>
</html>
