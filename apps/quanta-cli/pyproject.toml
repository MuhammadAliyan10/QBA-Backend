[tool.poetry]
name = "quanta-cli"
version = "0.1.0"
description = "B2B Developer CLI for generating secure BYOS execution states for Quanta."
authors = ["Quanta Systems <engineering@quanta.dev>"]
readme = "README.md"
packages = [{include = "quanta_cli"}]

[tool.poetry.dependencies]
python = "^3.10"
typer = {extras = ["all"], version = "^0.12.0"}
playwright = "^1.48.0"
httpx = "^0.27.0"

[tool.poetry.scripts]
quanta = "quanta_cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
