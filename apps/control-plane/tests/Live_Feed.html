<!DOCTYPE html>
<html>
  <head>
    <title>e2e Live Feed Debugger</title>
    <style>
      body {
        background: #1a1a1a;
        color: #0f0;
        font-family: monospace;
        padding: 20px;
      }
      #logs {
        border: 1px solid #333;
        padding: 10px;
        height: 400px;
        overflow-y: scroll;
        background: #000;
      }
      .log {
        margin: 5px 0;
        border-bottom: 1px solid #222;
        padding: 2px;
      }
      .status-SUCCESS {
        color: #0f0;
      }
      .status-RUNNING {
        color: #ff0;
      }
      .status-FAILED {
        color: #f00;
      }
      button {
        padding: 10px 20px;
        background: #333;
        color: #fff;
        border: none;
        cursor: pointer;
        font-size: 16px;
        margin-bottom: 10px;
      }
      button:hover {
        background: #444;
      }
    </style>
  </head>
  <body>
    <h1>🔮 God Mode: Live Nervous System Feed</h1>
    <button onclick="startMission()">🚀 Launch Mission</button>
    <div id="status">Waiting...</div>
    <div id="logs"></div>

    <script>
      let socket;

      async function startMission() {
        const logDiv = document.getElementById("logs");
        logDiv.innerHTML += `<div class="log">--- REQUESTING NEW MISSION ---</div>`;

        // 1. Call API to start job
        const res = await fetch("http://localhost:8080/run", {
          method: "POST",
        });
        const data = await res.json();
        const jobId = data.job_id;

        document.getElementById("status").innerText = `Tracking Job: ${jobId}`;

        // 2. Connect WebSocket to watch THIS job
        if (socket) socket.close();

        // Note: In real app, we pass Clerk Token here too
        socket = new WebSocket(`ws://localhost:8080/ws?job_id=${jobId}`);

        socket.onopen = () => {
          logDiv.innerHTML += `<div class="log">🔌 WebSocket Connected! Listening for Brain signals...</div>`;
        };

        socket.onmessage = (event) => {
          const msg = JSON.parse(event.data);
          console.log("Received:", msg);

          const html = `
                    <div class="log">
                        <span class="status-${msg.status}">[${msg.status}]</span>
                        [Node: ${msg.node_id}]
                        ${msg.log_message}
                    </div>
                `;
          logDiv.innerHTML += html;
          logDiv.scrollTop = logDiv.scrollHeight; // Auto scroll
        };
      }
    </script>
  </body>
</html>
