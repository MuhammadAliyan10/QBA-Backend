<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>e2e | Infrastructure Console</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }

        /* Smooth Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Animations */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .log-enter { animation: slideUpFade 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards; }

        .status-dot-active {
            animation: pulse-ring 2s infinite;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen antialiased selection:bg-blue-100 selection:text-blue-900">

    <nav class="border-b border-slate-200 bg-white/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-6 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-slate-900 text-white rounded-lg flex items-center justify-center font-bold text-lg tracking-tighter">e2e</div>
                <span class="font-semibold text-slate-700">Control Plane</span>
                <span class="bg-slate-100 text-slate-500 text-[10px] font-bold px-2 py-0.5 rounded-full border border-slate-200">V1.0</span>
            </div>

            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-xs font-medium text-slate-500 bg-slate-50 px-3 py-1.5 rounded-full border border-slate-200">
                    <div id="connection-dot" class="w-2 h-2 rounded-full bg-red-400"></div>
                    <span id="connection-text">DISCONNECTED</span>
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-6 py-12">

        <div class="mb-10 text-center">
            <h1 class="text-4xl font-bold tracking-tight text-slate-900 mb-3">Decision-Grade Automation</h1>
            <p class="text-lg text-slate-500 max-w-2xl mx-auto">
                Execute complex browser workflows with deterministic reliability.
                <br>Powered by <span class="font-mono text-xs bg-slate-100 px-1 py-0.5 rounded border border-slate-200">GlassBox™ Engine</span>
            </p>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden mb-8 transition-all hover:shadow-md">
            <div class="p-6 grid grid-cols-1 md:grid-cols-12 gap-6 items-end">

                <div class="md:col-span-6 space-y-2">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider ml-1">Target URL</label>
                    <div class="relative group">
                        <i data-lucide="globe" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 group-focus-within:text-blue-500 transition-colors"></i>
                        <input id="url-input" type="text" value="https://en.wikipedia.org/wiki/Main_Page"
                               class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all placeholder:text-slate-400"
                               placeholder="https://example.com">
                    </div>
                </div>

                <div class="md:col-span-4 space-y-2">
                    <label class="text-xs font-semibold text-slate-500 uppercase tracking-wider ml-1">Workflow Recipe</label>
                    <div class="relative group">
                        <i data-lucide="scroll-text" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 group-focus-within:text-blue-500 transition-colors"></i>
                        <select id="workflow-select"
                                class="w-full pl-10 pr-8 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all appearance-none cursor-pointer">
                            <option value="test_login">Wikipedia Injection</option>
                            <option value="amazon_scraper">Amazon Scraper (High Security)</option>
                        </select>
                        <i data-lucide="chevron-down" class="absolute right-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400 pointer-events-none"></i>
                    </div>
                </div>

                <div class="md:col-span-2">
                    <button onclick="startJob()" id="run-btn"
                            class="w-full bg-slate-900 hover:bg-slate-800 text-white font-medium py-2.5 rounded-lg shadow-lg shadow-slate-900/20 transition-all active:scale-95 flex items-center justify-center gap-2">
                        <span>Run</span>
                        <i data-lucide="play" class="w-3 h-3 fill-current"></i>
                    </button>
                </div>
            </div>

            <div id="progress-container" class="h-1 w-full bg-slate-100 hidden">
                <div id="progress-bar" class="h-full bg-blue-500 w-0 transition-all duration-300"></div>
            </div>
        </div>

        <div class="bg-white rounded-xl border border-slate-200 shadow-sm min-h-[500px] flex flex-col relative overflow-hidden">

            <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between bg-slate-50/50">
                <div class="flex items-center gap-2">
                    <i data-lucide="activity" class="w-4 h-4 text-slate-500"></i>
                    <span class="text-sm font-semibold text-slate-700">Live Execution Feed</span>
                </div>
                <div class="flex gap-2">
                    <span class="flex h-2 w-2">
                        <span class="animate-ping absolute inline-flex h-2 w-2 rounded-full bg-blue-400 opacity-75"></span>
                        <span class="relative inline-flex rounded-full h-2 w-2 bg-blue-500"></span>
                    </span>
                    <span class="text-xs text-slate-400 font-mono">NATS JETSTREAM</span>
                </div>
            </div>

            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center text-center p-8">
                <div class="w-16 h-16 bg-slate-50 rounded-2xl flex items-center justify-center mb-4 border border-slate-100">
                    <i data-lucide="box" class="w-8 h-8 text-slate-300"></i>
                </div>
                <h3 class="text-sm font-semibold text-slate-900">Ready to Automate</h3>
                <p class="text-sm text-slate-500 max-w-xs mt-1">Select a workflow above to spin up a headless browser worker.</p>
            </div>

            <div id="logs-container" class="flex-1 p-6 space-y-3 overflow-y-auto hidden relative z-10 font-mono text-sm">
                </div>

        </div>
    </main>

    <script>
        // Initialize Icons
        lucide.createIcons();

        let ws;
        let stepCount = 0;

        async function startJob() {
            const url = document.getElementById('url-input').value;
            const workflowId = document.getElementById('workflow-select').value;
            const logs = document.getElementById('logs-container');
            const emptyState = document.getElementById('empty-state');
            const runBtn = document.getElementById('run-btn');

            // UI Reset
            emptyState.classList.add('hidden');
            logs.classList.remove('hidden');
            logs.innerHTML = '';
            stepCount = 0;
            updateStatus("connecting");

            // Button Loading State
            runBtn.disabled = true;
            runBtn.innerHTML = `<i data-lucide="loader-2" class="w-4 h-4 animate-spin"></i> Processing`;
            lucide.createIcons();

            // Insert "System Init" Log
            addLog("SYSTEM", "init", "Queuing Request via API Gateway...", "info");

            try {
                const res = await fetch('http://localhost:8080/run', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        workflow_id: workflowId,
                        params: { url: url, search_term: "Generative AI" },
                        config: { use_premium_proxy: false }
                    })
                });

                const data = await res.json();

                if(res.status >= 400) throw new Error(data.error || "API Error");

                const jobId = data.job_id;

                addLog("SYSTEM", "queue", `Job Assigned: ${jobId}`, "success");
                connectWebSocket(jobId);

            } catch (e) {
                addLog("ERROR", "fatal", `Connection Failed: ${e.message}`, "error");
                resetButton();
            }
        }

        function connectWebSocket(jobId) {
            if (ws) ws.close();

            ws = new WebSocket(`ws://localhost:8080/ws?job_id=${jobId}`);

            ws.onopen = () => {
                updateStatus("connected");
                addLog("NATS", "stream", "Established Real-Time Stream", "info");
            };

            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);

                // Robust parsing
                const status = msg.status || "INFO";
                const text = msg.message || msg.log_message || JSON.stringify(msg);
                const node = msg.node_id || "exec";

                // Determine Log Type
                let type = "default";
                if (status === "FAILED") type = "error";
                if (status === "SUCCESS") type = "success";
                if (status === "HEALER_ACTIVE") type = "healer";
                if (status === "COMPLETED") {
                    type = "success";
                    resetButton();
                }

                addLog(status, node, text, type);
            };

            ws.onclose = () => {
                updateStatus("disconnected");
            };
        }

        function addLog(status, node, text, type) {
            const container = document.getElementById('logs-container');
            const entry = document.createElement('div');

            // Styling based on type
            let borderColor = "border-slate-200";
            let iconColor = "text-slate-400";
            let iconName = "terminal";
            let textColor = "text-slate-600";
            let bgColor = "bg-white";

            if (type === 'success') {
                borderColor = "border-emerald-200";
                iconColor = "text-emerald-500";
                iconName = "check-circle-2";
                bgColor = "bg-emerald-50/50";
                textColor = "text-emerald-900";
            } else if (type === 'error') {
                borderColor = "border-red-200";
                iconColor = "text-red-500";
                iconName = "alert-circle";
                bgColor = "bg-red-50/50";
                textColor = "text-red-900";
            } else if (type === 'healer') {
                borderColor = "border-violet-200";
                iconColor = "text-violet-500";
                iconName = "zap"; // Magic icon
                bgColor = "bg-violet-50/50";
                textColor = "text-violet-900";
            } else if (status === 'RUNNING') {
                iconName = "loader"; // Will animate manually
                iconColor = "text-blue-500";
            }

            // Time
            const time = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric" });

            entry.className = `log-enter flex items-start gap-3 p-3 rounded-lg border ${borderColor} ${bgColor}`;

            // LOG HTML STRUCTURE
            entry.innerHTML = `
                <div class="mt-0.5 ${iconName === 'loader' ? 'animate-spin' : ''}">
                    <i data-lucide="${iconName}" class="w-4 h-4 ${iconColor}"></i>
                </div>
                <div class="flex-1 min-w-0">
                    <div class="flex items-center gap-2 mb-0.5">
                        <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400">${node}</span>
                        <span class="text-[10px] text-slate-300 font-mono ml-auto">${time}</span>
                    </div>
                    <p class="text-sm font-medium ${textColor} break-words leading-relaxed">${text}</p>
                </div>
            `;

            container.appendChild(entry);
            lucide.createIcons(); // Re-render icons
            container.scrollTop = container.scrollHeight;
        }

        function updateStatus(state) {
            const dot = document.getElementById('connection-dot');
            const text = document.getElementById('connection-text');

            if (state === "connected") {
                dot.className = "w-2 h-2 rounded-full bg-emerald-500 status-dot-active";
                text.innerText = "LIVE STREAM ACTIVE";
                text.className = "text-emerald-600";
                document.getElementById('connection-text').parentElement.className = "flex items-center gap-2 text-xs font-bold bg-emerald-50 px-3 py-1.5 rounded-full border border-emerald-200";
            } else if (state === "connecting") {
                dot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
                text.innerText = "CONNECTING...";
                text.className = "text-amber-600";
                document.getElementById('connection-text').parentElement.className = "flex items-center gap-2 text-xs font-bold bg-amber-50 px-3 py-1.5 rounded-full border border-amber-200";
            } else {
                dot.className = "w-2 h-2 rounded-full bg-red-400";
                text.innerText = "DISCONNECTED";
                text.className = "text-slate-500";
                document.getElementById('connection-text').parentElement.className = "flex items-center gap-2 text-xs font-bold bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200";
            }
        }

        function resetButton() {
            const runBtn = document.getElementById('run-btn');
            runBtn.disabled = false;
            runBtn.innerHTML = `<span>Run</span><i data-lucide="play" class="w-3 h-3 fill-current"></i>`;
            lucide.createIcons();
        }
    </script>
</body>
</html>
