services:
  # --- 1. THE NERVOUS SYSTEM (NATS JETSTREAM) ---
  nats:
    image: nats:latest
    container_name: quanta_nats
    restart: unless-stopped
    ports:
      - "4222:4222" # Client Port
      - "8222:8222" # Dashboard Port
    # Force enable JetStream and set monitoring port
    command: "-js -m 8222"
    volumes:
      # Optional: Map config if you need custom limits later
      # - ./config/nats.conf:/etc/nats/nats-server.conf
      - nats_data:/data
    networks:
      - quanta-net
    # healthcheck:
    #   test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/varz"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5

  # --- 2. THE ORCHESTRATOR (TEMPORAL) ---
  temporal:
    image: temporalio/auto-setup:latest
    container_name: quanta_temporal
    restart: unless-stopped
    ports:
      - "7233:7233" # gRPC Port
    environment:
      - DB=postgres12
      - POSTGRES_SEEDS=quanta_postgres
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_DB=temporal
      - DB_PORT=5432
      - SKIP_DEFAULT_VERSION_CHECK=true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - quanta-net

  temporal-ui:
    image: temporalio/ui:latest
    container_name: quanta_temporal_ui
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    depends_on:
      - temporal
    networks:
      - quanta-net

  postgres:
    image: postgres:15-alpine
    container_name: quanta_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    volumes:
      - temporal_db_data:/var/lib/postgresql/data
    networks:
      - quanta-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 3. THE LEDGER (POSTGRESQL - Local Dev Only) ---
  # NOTE: In production, use Supabase DATABASE_URL directly
  app_postgres:
    image: postgres:15-alpine
    container_name: quanta_app_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=quanta
    ports:
      - "5433:5432" # Expose on 5433 to avoid conflict with Temporal's postgres
    volumes:
      - app_db_data:/var/lib/postgresql/data
    networks:
      - quanta-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- 4. THE CACHE (REDIS) ---
  redis:
    image: redis:alpine
    container_name: quanta_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    networks:
      - quanta-net

  # --- 5. THE STORAGE (MINIO - LOCAL S3) ---
  minio:
    image: minio/minio:latest
    container_name: quanta_minio
    restart: unless-stopped
    ports:
      - "9000:9000" # API
      - "9001:9001" # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - quanta-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Helper to create the default bucket automatically
  minio-create-bucket:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/quanta-local-bucket;
      /usr/bin/mc anonymous set public myminio/quanta-local-bucket;
      exit 0;
      "
    networks:
      - quanta-net

  # --- 6. THE BRAIN (QDRANT VECTOR DB) ---
  qdrant:
    image: qdrant/qdrant:latest
    container_name: quanta_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - quanta-net
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:6333/"]
    #   interval: 5s
    #   timeout: 5s
    #   retries: 5

  # --- 7. THE LOGS (CLICKHOUSE - Optional) ---
  # clickhouse:
  #   image: clickhouse/clickhouse-server
  #   container_name: quanta_clickhouse
  #   ports:
  #     - "8123:8123"
  #     - "9000:9000"
  #   ulimits:
  #     nofile:
  #       soft: 262144
  #       hard: 262144
  #   volumes:
  #     - clickhouse_data:/var/lib/clickhouse
  #   networks:
  #     - quanta-net

  # --- 8. THE CONTROL PLANE (GO API) ---
  control-plane:
    build:
      context: .
      dockerfile: apps/control-plane/Dockerfile
    container_name: quanta_control_plane
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - REDIS_URL=redis://redis:6379
      - NATS_URL=nats://nats:4222
      - TEMPORAL_HOST=temporal:7233
      - NVIDIA_API_KEY=${NVIDIA_API_KEY:-dummy_key_to_pass_validation}
      - SKIP_AUTH=true
      - DEV_USER_ID=${DEV_USER_ID:-00000000-0000-0000-0000-000000000000}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:-test_secret_123}
      # AES-256-GCM master key for the Credentials Vault — MUST be exactly 32 bytes.
      # Override in production via secrets manager; never commit real keys.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-quanta-dev-key-00000000000000000}
      # Local dev DB (avoid leaking host DATABASE_URL into container)
      - DATABASE_URL=postgresql://postgres:postgres@app_postgres:5432/quanta
      - ALLOW_LOCAL_TARGETS=${ALLOW_LOCAL_TARGETS:-false}
    depends_on:
      nats:
        condition: service_started
      redis:
        condition: service_started
      temporal:
        condition: service_started
      app_postgres:
        condition: service_healthy
    networks:
      - quanta-net
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080/health",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- 9. THE EXECUTION PLANE (PYTHON WORKER) ---
  execution-plane:
    build:
      context: .
      dockerfile: apps/execution-plane/Dockerfile
    container_name: quanta_execution_plane
    restart: unless-stopped
    environment:
      - TEMPORAL_HOST=temporal:7233
      - NATS_URL=nats://nats:4222
      - QDRANT_URL=http://qdrant:6333
      # AI Keys (Passed from host .env)
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
      # Local dev DB (avoid leaking host DATABASE_URL into container)
      - DATABASE_URL=postgresql://postgres:postgres@app_postgres:5432/quanta
    depends_on:
      temporal:
        condition: service_started
      nats:
        condition: service_started
      qdrant:
        condition: service_started
    networks:
      - quanta-net
    volumes:
      # DEV: Mount source code so Python changes are picked up on restart (no rebuild needed)
      - ./apps/execution-plane/src:/app/src

volumes:
  nats_data:
  temporal_db_data:
  app_db_data:
  redis_data:
  minio_data:
  qdrant_data:
  # clickhouse_data:

networks:
  quanta-net:
    driver: bridge
